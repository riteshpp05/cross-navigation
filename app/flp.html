<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>SAP Fiori Launchpad - Cross Navigation Demo</title>

    <script type="text/javascript">
        window["sap-ushell-config"] = {
            defaultRenderer: "fiori2",
            renderers: {
                fiori2: {
                    componentData: {
                        config: {
                            search: "hidden",
                            enableSearch: false,
                            rootIntent: "Shell-home"
                        }
                    }
                }
            },
            services: {
                LaunchPage: {
                    adapter: {
                        config: {
                            groups: [
                                {
                                    id: "demo_group",
                                    title: "Demo",
                                    isPreset: true,
                                    isVisible: true,
                                    isGroupLocked: false,
                                    tiles: [
                                        {
                                            id: "orders_tile",
                                            title: "Sales Orders",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                chipId: "sap_ushell_generated_chip_id",
                                                title: "Sales Orders",
                                                subtitle: "App A (Source)",
                                                info: "Manage Orders",
                                                targetURL: "#Order-manage"
                                            }
                                        },
                                        {
                                            id: "customers_tile",
                                            title: "Customers",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                chipId: "sap_ushell_generated_chip_id",
                                                title: "Customers",
                                                subtitle: "App B (Target)",
                                                info: "Display Customers",
                                                targetURL: "#Customer-display"
                                            }
                                        },
                                        {
                                            id: "webgui_tile",
                                            title: "VA03 - Sales Order",
                                            size: "1x1",
                                            tileType: "sap.ushell.ui.tile.StaticTile",
                                            properties: {
                                                chipId: "sap_ushell_generated_chip_id",
                                                title: "VA03 - Sales Order",
                                                subtitle: "SAP GUI for HTML",
                                                info: "On-Prem to On-Prem",
                                                targetURL: "#Order-displayGUI?orderId=4500001"
                                            }
                                        }
                                    ]
                                }
                            ]
                        }
                    }
                },
                NavTargetResolution: {
                    config: {
                        enableClientSideTargetResolution: true
                    }
                }
            },
            applications: {
                // ──────────────────────────────────────────────────────────────
                // Target Mapping 1: Order-manage → App A (Sales Orders)
                // Semantic Object: "Order", Action: "manage"
                // This is the entry point — the source application
                // ──────────────────────────────────────────────────────────────
                "Order-manage": {
                    title: "Sales Orders",
                    description: "App A (Source)",
                    additionalInformation: "SAPUI5.Component=crossn.orders",
                    applicationType: "URL",
                    url: "./orders/webapp"
                },

                // ──────────────────────────────────────────────────────────────
                // Target Mapping 2: Customer-display → App B (Customers)
                // Semantic Object: "Customer", Action: "display"
                // Pattern 1: Cloud-to-Cloud (✅ PRODUCTION-GRADE — same code
                //            works in SAP Build Work Zone Standard Edition)
                // ──────────────────────────────────────────────────────────────
                "Customer-display": {
                    title: "Customers",
                    description: "App B (Target)",
                    additionalInformation: "SAPUI5.Component=crossn.customers",
                    applicationType: "URL",
                    url: "./customers/webapp"
                },

                // ──────────────────────────────────────────────────────────────
                // Target Mapping 3: LegacyOrder-display
                // Pattern 2: Cloud to On-Premise (BTP App → ABAP BSP via Cloud Connector)
                //
                // ┌─── PRODUCTION EQUIVALENT ────────────────────────────────────┐
                // │ In SAP Build Work Zone / BTP Launchpad:                      │
                // │   applicationType : "URL"                                    │
                // │   url             : "<BTP_Destination>/sap/bc/bsp/sap/<app>" │
                // │   systemAlias     : "BACKEND_S4"                             │
                // │                                                              │
                // │ Prerequisites:                                               │
                // │   1. SAP Cloud Connector installed & connected to subaccount │
                // │   2. Virtual host mapped in SCC (e.g. s4backend:443)         │
                // │   3. BTP Destination created pointing to virtual host        │
                // │   4. SICF service activated for /sap/bc/bsp/sap/<app>        │
                // │   5. Principal Propagation configured for SSO                │
                // └──────────────────────────────────────────────────────────────┘
                //
                // LOCAL SANDBOX SIMULATION (mock HTML page):
                "LegacyOrder-display": {
                    title: "Legacy Orders",
                    description: "Legacy BSP Order System (Cloud to On-Prem)",
                    applicationType: "URL",
                    url: "legacy-bsp/index.html"    // ← Mock: in production, this is a BTP Destination URL
                },

                // ──────────────────────────────────────────────────────────────
                // Target Mapping 4: Order-displayGUI
                // Pattern 3: On-Premise to On-Premise (S/4HANA FLP → WebGUI VA03)
                //
                // ┌─── PRODUCTION EQUIVALENT (configured in /UI2/FLPD_CUST) ────┐
                // │   applicationType : "Transaction"   ← NOT "URL"             │
                // │   transaction     : "VA03"                                   │
                // │   systemAlias     : "LOCAL"          ← same system, no tunnel│
                // │                                                              │
                // │ Parameter Mapping (in Target Mapping config):                │
                // │   Intent param  : orderId                                    │
                // │   Dynpro field  : VBAK-VBELN                                 │
                // │                                                              │
                // │ The Launchpad constructs the skip-screen URL automatically:  │
                // │   /sap/bc/gui/sap/its/webgui                                │
                // │     ?~transaction=*VA03 VBAK-VBELN=4500001;DYNP_OKCODE=SHOW │
                // │                                                              │
                // │   *     = skip the initial selection screen                  │
                // │   VBAK-VBELN = fill order number into the Dynpro field       │
                // │   DYNP_OKCODE=SHOW = press the Display button               │
                // └──────────────────────────────────────────────────────────────┘
                //
                // LOCAL SANDBOX SIMULATION (mock HTML page styled like SAP GUI):
                "Order-displayGUI": {
                    title: "Display Sales Order (VA03)",
                    description: "SAP GUI for HTML Transaction (On-Prem to On-Prem)",
                    applicationType: "URL",
                    url: "legacy-webgui/index.html",    // ← Mock: in production, applicationType is "Transaction"
                    navigationMode: "newWindow"
                }
            }
        };
    </script>

    <script src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js" id="sap-ushell-bootstrap"></script>

    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-resourceroots='{
            "crossn.orders": "./orders/webapp",
            "crossn.customers": "./customers/webapp"
        }'
        data-sap-ui-frameOptions="allow">
    </script>

    <script type="text/javascript">
        sap.ui.getCore().attachInit(function () {
            // Isolate our Demo group so only our 3 demo tiles appear on the Launchpad homepage
            var oLpConfig = sap.ui.require("sap/base/util/ObjectPath").get("services.LaunchPage.adapter.config", window["sap-ushell-config"]);
            if (oLpConfig && oLpConfig.groups && oLpConfig.groups.length > 0) {
                oLpConfig.groups = [oLpConfig.groups[0]];
            }

            sap.ushell.Container.createRenderer("fiori2", true).then(function (renderer) {
                renderer.placeAt("content");
            });
        });
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
